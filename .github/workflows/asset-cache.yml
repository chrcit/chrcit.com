name: Asset cache policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  asset-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: node scripts/check-asset-cache.mjs
